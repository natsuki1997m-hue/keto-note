<!DOCTYPE html>
<html lang="ja">
<head>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d6b52">
<title>ケトン食ノート</title>
<style>
/* 方針: 台所の計量メモ。紙のような薄い緑灰の地に、濃い緑を軸にして、栄養素ごとに色と文字の両方で区別する。大きな文字と大きなボタン。 */
:root{
  --bg:#f1f5f2; --card:#ffffff; --ink:#14241c; --sub:#57675f; --line:#d8e2dc;
  --pri:#1d6b52; --pri-ink:#ffffff; --pri-soft:#e0efe8;
  --fat:#1d6b52; --carb:#b4540a; --prot:#1f5f9e;
  --warn:#a14a07; --warn-soft:#fcefd9; --danger:#b3261e; --shadow:0 1px 2px rgba(20,36,28,.08),0 4px 14px rgba(20,36,28,.06);
  --font:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic",Meiryo,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1a15; --card:#17261f; --ink:#e9f2ed; --sub:#a0b3a9; --line:#2a3f35;
    --pri:#58c49c; --pri-ink:#07281c; --pri-soft:#1c3a2e;
    --fat:#58c49c; --carb:#f0a45d; --prot:#7ab6ee;
    --warn:#f0b36e; --warn-soft:#3a2a12; --danger:#ff8a80; --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1a15; --card:#17261f; --ink:#e9f2ed; --sub:#a0b3a9; --line:#2a3f35;
  --pri:#58c49c; --pri-ink:#07281c; --pri-soft:#1c3a2e;
  --fat:#58c49c; --carb:#f0a45d; --prot:#7ab6ee;
  --warn:#f0b36e; --warn-soft:#3a2a12; --danger:#ff8a80; --shadow:none;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--font);-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
#banner{background:var(--warn-soft);color:var(--warn);padding:10px 16px;font-size:15px;font-weight:600}

/* 日付バー */
.datebar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px}
.datebar .wrap{display:flex;align-items:center;gap:8px}
.arrow{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:22px;line-height:1}
.dateLabel{position:relative;flex:1;height:48px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:18px}
.dateLabel input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.todayBtn{height:48px;padding:0 14px;border-radius:14px;border:1px solid var(--pri);background:var(--pri-soft);color:var(--pri);font-weight:700}

main{padding-bottom:110px}
h1.pageTitle{font-size:24px;margin:18px 0 4px}
.lead{color:var(--sub);margin:0 0 14px}

/* 合計 */
.sum{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:16px;margin:6px 0 16px;border:1px solid var(--line)}
.ratioRow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.cap{font-size:14px;color:var(--sub);font-weight:700}
.ratio{font-size:52px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ratio small{font-size:22px;font-weight:700;color:var(--sub);letter-spacing:0}
.chip{display:inline-block;background:var(--pri-soft);color:var(--pri);font-weight:700;font-size:15px;padding:4px 12px;border-radius:999px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.stat .nm{font-size:14px;font-weight:700;color:var(--sub);display:flex;align-items:center;gap:6px}
.stat .nm i{width:10px;height:10px;border-radius:3px;background:var(--c,var(--sub));display:inline-block}
.stat .val{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .val small{font-size:14px;font-weight:600;color:var(--sub);margin-left:2px}
.bar{height:6px;border-radius:99px;background:var(--line);margin-top:6px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--c,var(--pri));border-radius:99px}
.bar.over b{background:var(--warn)}
.goalTxt{font-size:13px;color:var(--sub);margin-top:4px}
.goalTxt.over{color:var(--warn);font-weight:700}
.formula{margin:12px 0 0;font-size:13px;color:var(--sub)}

/* 食事 */
.meal{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.meal>header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:14px 16px 8px}
.meal h2{margin:0;font-size:20px}
.meal .sub{font-size:14px;color:var(--sub);text-align:right}
.entry{border-top:1px solid var(--line)}
.entryMain{display:block;width:100%;text-align:left;background:none;border:0;padding:12px 16px}
.entryMain .top{display:flex;justify-content:space-between;gap:10px}
.entryMain .name{font-weight:700;overflow-wrap:anywhere}
.entryMain .amt{color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}
.nums{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:14px;color:var(--sub);margin-top:2px;font-variant-numeric:tabular-nums}
.nums b{color:var(--ink)}
.nums .f{color:var(--fat)} .nums .c{color:var(--carb)} .nums .p{color:var(--prot)}
.exp{margin:0 16px 10px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:none;font-size:14px;color:var(--sub)}
.items{margin:0 16px 12px;padding:8px 12px;border-radius:12px;background:var(--bg);font-size:15px}
.items div{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.mealfoot{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px 16px;border-top:1px solid var(--line)}
.empty{padding:2px 16px 12px;color:var(--sub)}

.btn{min-height:48px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:700}
.btn.primary{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.btn.big{width:100%;min-height:54px;font-size:18px}
.btn.ghost{background:none;color:var(--pri);border-color:var(--pri)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:none}
.btn.sm{min-height:44px;padding:0 12px;font-size:15px}
.mealfoot .primary{flex:1 1 200px}

/* 下のナビ */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding-top:6px;padding-bottom:6px}
.nav button{border:0;background:none;min-height:56px;border-radius:14px;font-size:14px;font-weight:700;color:var(--sub);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--pri);background:var(--pri-soft)}

/* マイフード・設定 */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:12px}
.card h3{margin:0 0 4px;font-size:18px}
.card .meta{font-size:14px;color:var(--sub)}
.card .btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.field{display:block;margin:0 0 12px}
.field>span{display:block;font-size:14px;font-weight:700;color:var(--sub);margin-bottom:4px}
.field input,.field textarea{width:100%;min-width:0;min-height:48px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.field textarea{min-height:120px;font-size:13px;font-family:ui-monospace,monospace}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.note{font-size:14px;color:var(--sub)}
.about{font-size:14px;color:var(--sub)}
.about p{margin:0 0 8px}

/* シート */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,20,15,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;height:94%;border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheet.short{height:auto;max-height:90%}
.sheetTop{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 8px}
.sheetTop h2{margin:0;font-size:20px}
.sheetBody{flex:1;min-height:0;overflow:auto;overflow-x:hidden;padding:0 16px 16px}
.sheet>*{min-width:0}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 16px 8px}
.tabs button{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;color:var(--sub)}
.tabs button[aria-selected="true"]{background:var(--pri-soft);color:var(--pri);border-color:var(--pri)}
.search{padding:0 16px 8px}
.search input{width:100%;min-width:0;min-height:52px;padding:8px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:18px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:15px;font-weight:600;color:var(--sub)}
.chips button[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.row{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:8px}
.row .nm{font-weight:700;overflow-wrap:anywhere}
.row .tag{font-size:12px;color:var(--pri);background:var(--pri-soft);border-radius:6px;padding:1px 6px;margin-left:6px;font-weight:700;white-space:nowrap}
.row .per{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:2px}
.row[aria-pressed="true"]{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri) inset}
.hint{color:var(--sub);font-size:15px;margin:6px 0 10px}
.pick{border-top:1px solid var(--line);background:var(--card);padding:12px 16px calc(14px + env(safe-area-inset-bottom))}
.pick .head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.pick .head b{overflow-wrap:anywhere}
.pick .amount{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.pick .amount input{flex:1;min-width:0;width:100%;min-height:56px;font-size:26px;font-weight:800;text-align:right;padding:0 12px;border-radius:12px;border:2px solid var(--pri);background:var(--bg);font-variant-numeric:tabular-nums}
.pick .amount span{font-size:20px;font-weight:700}
.quick{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.quick button{min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:15px}
.prev{margin-bottom:10px}

.irow{display:grid;grid-template-columns:1fr 84px 44px 44px;gap:8px;align-items:center;margin-bottom:8px}
.irow .nm{font-weight:600;overflow-wrap:anywhere;font-size:16px}
.irow input{min-height:46px;width:100%;min-width:0;padding:0 8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);text-align:right;font-variant-numeric:tabular-nums}
.irow button[data-sw]{color:var(--pri);border-color:var(--pri)}
.irow button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--danger);font-size:18px}

.chk{display:flex;align-items:center;gap:12px;min-height:48px;margin:0 0 12px;font-weight:700}
.chk input{width:26px;height:26px;accent-color:var(--pri)}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;font-size:16px;max-width:90%;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
[hidden]{display:none!important}
@media (prefers-reduced-motion: no-preference){
  .sheet{animation:up .18s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
}
</style>
</head>
<body>
<div id="banner" hidden>この画面では記録を保存できません。ブラウザの設定で保存を許可するか、普通のブラウザで開いてください。</div>
<div class="datebar" id="dateBar"><div class="wrap">
  <button class="arrow" id="prevDay" aria-label="前の日">‹</button>
  <label class="dateLabel"><span id="dateText"></span><input type="date" id="dateInput" aria-label="日付を選ぶ"></label>
  <button class="todayBtn" id="todayBtn" hidden>今日</button>
  <button class="arrow" id="nextDay" aria-label="次の日">›</button>
</div></div>
<main><div class="wrap" id="app"></div></main>
<nav class="nav" aria-label="メニュー"><div class="wrap">
  <button data-tab="today"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M4 10h16M9 5v14"/></svg>きょう</button>
  <button data-tab="my"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.4A4 4 0 0 1 19 10c0 5.600-7 10-7 10z"/></svg>マイフード</button>
  <button data-tab="set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.600 5.600l2.100 2.100M16.300 16.300l2.100 2.100M5.600 18.400l2.100-2.100M16.300 7.700l2.100-2.100"/></svg>せってい</button>
</div></nav>
<div id="overlay"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

/* ---------- 食品を探す ---------- */
function allSearchable(){
  var c=S.custom.map(function(x){return {id:x.id,n:x.n,cat:'',al:'',per:x.per,dg:x.dg||0,custom:true,nk:norm(x.n),words:[norm(x.n)],key:norm(x.n)}});
  return c.concat(FOODS);
}
function expand(t){var b=[t];if(t.length>2&&t.slice(-1)==='肉')b.push(t.slice(0,-1));var c=b.slice();b.forEach(function(x){ALN.forEach(function(a){if(x.indexOf(a[0])>=0)c.push(x.replace(a[0],a[1]))})});return c}
/* 0:単語が一致 1:単語の末尾が一致（有塩バター） 2:先頭が一致（バターケーキ） 3:途中に含む 4:分類・別名だけ */
function tier(f,c){
  var w=f.words,i;
  for(i=0;i<w.length;i++)if(w[i]===c)return 0;
  for(i=0;i<w.length;i++)if(w[i].length>c.length&&w[i].slice(-c.length)===c)return 1;
  for(i=0;i<w.length;i++)if(w[i].indexOf(c)===0)return 2;
  return f.nk.indexOf(c)>=0?3:4;
}
/* 「卵 85g」「卵85」「85g 卵」のように、食品名とグラムを一緒に打っても分けて読む */
function parseQ(q){
  var s=String(q).normalize('NFKC').trim(), m;
  m=s.match(/^(.*?)\s*(\d+(?:\.\d+)?)\s*(?:g|グラム)?$/i);
  if(m&&m[1].trim()&&parseFloat(m[2])>0)return {text:m[1].trim(),g:parseFloat(m[2])};
  m=s.match(/^(\d+(?:\.\d+)?)\s*(?:g|グラム)?\s+(.+)$/i);
  if(m&&parseFloat(m[1])>0)return {text:m[2].trim(),g:parseFloat(m[1])};
  return {text:s,g:0};
}
function search(q,grp){
  var toks=q.split(/[\s　]+/).filter(Boolean).map(norm).filter(Boolean);
  if(!toks.length&&!grp)return [];
  var res=[];
  allSearchable().forEach(function(f){
    if(grp&&!f.custom&&f.gr!==grp)return;
    if(grp&&f.custom)return;
    var score=f.custom?-1:0;
    for(var i=0;i<toks.length;i++){
      var cands=expand(toks[i]),best=-1;
      for(var j=0;j<cands.length;j++){
        if(f.key.indexOf(cands[j])>=0){var s=tier(f,cands[j]);best=best<0?s:Math.min(best,s)}
      }
      if(best<0)return;
      score+=best;
    }
    res.push([score,COMMON[f.id]?0:1,res.length,f]);
  });
  res.sort(function(a,b){return a[0]-b[0]||a[1]-b[1]||a[2]-b[2]});
  return res.slice(0,60).map(function(r){return r[3]});
}
function pushRecent(f){
  var snap={id:f.id,n:f.n,per:f.per,custom:!!f.custom,dg:f.dg||0};
  S.recent=[snap].concat(S.recent.filter(function(r){return r.id!==f.id})).slice(0,15);
}

    var tot=(o.f||0)+(o.p||0)+(o.c||0);
    if(tot>o.base*1.05)w.push('脂質・たんぱく質・糖質の合計が量（'+o.base+'g）を超えています。小数点が抜けているかもしれません。');
    if(o.k!=null&&o.base>0){var calc=(o.p||0)*4+(o.f||0)*9+(o.c||0)*4;if(calc>20&&Math.abs(calc-o.k)>Math.max(25,o.k*0.35))w.push('カロリー（'+o.k+'kcal）が、他の数字から計算した値（約'+Math.round(calc)+'kcal）と大きく違います。読み間違いがないか確認してください。')}
  });
  return w.filter(function(x,i){return w.indexOf(x)===i}).join(' ');
}
function openCustom(name,done){
  var sh=openSheet('<div class="sheetTop"><h2>自分で食品を登録</h2><button class="btn sm" data-x>閉じる</button></div><div class="sheetBody">'+
    '<button class="btn primary big" data-clip style="margin-bottom:6px">📋 コピーした文字を貼って読み取る</button>'+
    '<details class="note" style="margin:0 0 12px"><summary style="cursor:pointer">写真の文字をコピーするには（Googleレンズ）</summary><ol style="margin:6px 0 0;padding-left:1.3em;line-height:1.7"><li>パッケージの栄養成分表示を写真に撮る</li><li>Googleフォトでその写真を開き、下の「レンズ」を押す</li><li>「テキスト」を押し、栄養成分表示の部分を選んで「コピー」</li><li>このアプリに戻り、上の「📋 コピーした文字を貼って読み取る」を押す</li></ol><p style="margin:6px 0 0">AIの答えをコピーした場合も、同じボタンで読み取れます。</p></details>'+
    '<label class="field"><span>貼り付けた文字（ここに直接貼っても読み取れます）</span><textarea id="paste" rows="3" style="min-height:84px;font-family:inherit;font-size:15px" placeholder="例：1個(50g)あたり 脂質5g たんぱく質6g 炭水化物0.5g"></textarea></label><button class="btn" data-parse style="margin-bottom:12px">読み取る</button><p class="note" id="pn" style="margin:0 0 10px"></p><div id="multi" hidden></div>'+
    '<label class="field"><span>名前</span><input id="cn" value="'+esc(name||'')+'"></label>'+
    '<label class="field"><span>この数字は何gあたり？（100gあたりなら100、1個50gなら50）</span><div class="amount" style="margin:0"><input id="cb" inputmode="decimal" value="100"><span>g あたり</span></div></label>'+
    '<div class="grid2"><label class="field"><span>脂質（g）</span><input id="cf" inputmode="decimal"></label><label class="field"><span>糖質（g）</span><input id="cc" inputmode="decimal"></label><label class="field"><span>たんぱく質（g）</span><input id="cp" inputmode="decimal"></label><label class="field"><span>カロリー（kcal）</span><input id="ck" inputmode="decimal" placeholder="空欄で自動"></label></div>'+
    '<label class="field"><span>いつも食べる量（g）※入れると、食事に追加するとき最初から入ります</span><input id="cd" inputmode="decimal" placeholder="例：30"></label>'+
    '<button class="btn primary big" data-save>登録する</button><p class="note" style="text-align:center;margin-top:10px">アプリの版：v16（Googleレンズの文字を貼って読み取り）（まとめて登録 1つずつグラム入力対応）</p></div>',true);
  var b=sh.box; $('[data-x]',b).onclick=sh.close;
  $('[data-clip]',b).onclick=function(){
    var ta=$('#paste',b),pn=$('#pn',b);
    function manual(){ta.focus();pn.textContent='自動で貼り付けできませんでした。下の欄を長押しして「貼り付け」を選び、そのあと「読み取る」を押してください。'}
    if(!(navigator.clipboard&&navigator.clipboard.readText)){manual();return}
    navigator.clipboard.readText().then(function(t){
      if(!t||!t.trim()){pn.textContent='コピーされた文字がありません。先にGoogleレンズやAIの答えで「コピー」を押してください。';return}
      ta.value=t;$('[data-parse]',b).click();
    }).catch(manual);
  };
  $('#paste',b).addEventListener('paste',function(){setTimeout(function(){$('[data-parse]',b).click()},50)});
  $('[data-parse]',b).onclick=function(){
    var list=parseMulti($('#paste',b).value), pn=$('#pn',b), mu=$('#multi',b);
    mu.innerHTML=''; mu.hidden=true;
    if(!list.length){pn.textContent='数字が見つかりませんでした。下に直接入れてください。';return}
    if(list.length===1){
      var o=list[0];
      if(o.name)$('#cn',b).value=o.name;
      $('#cf',b).value=o.f!=null?o.f:''; $('#cc',b).value=o.c!=null?o.c:''; $('#cp',b).value=o.p!=null?o.p:''; $('#ck',b).value=o.k!=null?o.k:'';
      $('#cb',b).value=o.base; if(o.base!==100&&!$('#cd',b).value)$('#cd',b).value=o.base;
      pn.textContent='読み取りました（'+o.base+'gあたり）。'+(o.note?o.note+'で計算しました。':'')+'下の数字が合っているか確認してから登録してください。';
      return;
    }
    pn.textContent=list.length+'個の食品が見つかりました。名前と数字を確かめて、まとめて登録できます。';
    mu.hidden=false;
    mu.innerHTML=list.map(function(o,i){return '<div class="card" data-m="'+i+'" style="margin-bottom:8px"><div class="irow" style="grid-template-columns:1fr 44px"><input data-mn value="'+esc(o.name)+'" placeholder="名前を入れてください" aria-label="名前"><button data-mx aria-label="この食品を外す">✕</button></div><div class="note" style="margin:6px 0 0">'+o.base+'gあたり ・ '+(o.k!=null?o.k+'kcal ・ ':'')+'脂'+(o.f!=null?o.f:0)+' 糖'+(o.c!=null?o.c:0)+' 蛋'+(o.p!=null?o.p:0)+'</div></div>'}).join('')+'<button class="btn primary big" data-multi>まとめて登録する</button>';
    mu.onclick=function(e){
      var x=e.target.closest('[data-mx]'); if(x){var cd=x.closest('[data-m]');list[+cd.dataset.m]=null;cd.remove();return}
      if(!e.target.closest('[data-multi]'))return;
      var cards=$$('[data-m]',mu),made=[],bad=false;
      cards.forEach(function(cd){var o=list[+cd.dataset.m];if(!o)return;var n=$('[data-mn]',cd).value.trim();if(!n){bad=true;return}made.push([n,o])});
      if(bad){toast('名前が空の食品があります');return}
      if(!made.length){toast('登録する食品がありません');return}
      var last=null;
      var foods=made.map(function(m){var o=m[1];return addCustomFood(m[0],o.base,o.f,o.c,o.p,o.k,o.base!==100?o.base:0)});foods.slice().reverse().forEach(pushRecent);last=foods[0];
      save();sh.close();toast(made.length+'個を登録しました');if(done)done(last,foods);
    };
  };
  $('[data-save]',b).onclick=function(){
    var n=$('#cn',b).value.trim(), bs=toNum($('#cb',b).value), f=toNum($('#cf',b).value)||0, c=toNum($('#cc',b).value)||0, p=toNum($('#cp',b).value)||0, k=toNum($('#ck',b).value), dg=toNum($('#cd',b).value);
    if(!n){toast('名前を入れてください');return}
    if(!(bs>0)){toast('「何gあたり」の数字を入れてください');return}
    if([$('#cf',b).value,$('#cc',b).value,$('#cp',b).value,$('#ck',b).value].every(function(v){return !String(v).trim()})){toast('栄養の数字を入れてください');return}
    var food=addCustomFood(n,bs,f,c,p,k,dg); save(); sh.close(); toast('登録しました'); if(done)done(food);
  };
}

/* ---------- 料理（材料のまとまり）の編集 ----------
   マイフードの登録・直し、食事に入れる料理づくり、食事に入れた料理の中身直しで共通に使う。
   o: {title,note,name,items,saveLabel,alsoMy,asNew,onSave(name,items,alsoMy),onDelete,delLabel} */
function copyItems(items){return items.map(function(i){return {n:i.n,g:i.g,per:i.per}})}
function openDishEditor(o){
  var items=copyItems(o.items||[]);
  var sh=openSheet('<div class="sheetTop"><h2>'+esc(o.title)+'</h2><button class="btn sm" data-x>閉じる</button></div><div class="sheetBody">'+
    (o.note?'<p class="note" style="margin:0 0 10px">'+o.note+'</p>':'')+
    '<label class="field"><span>料理の名前</span><input id="dn" value="'+esc(o.name||'')+'" placeholder="例：オムレツ"></label><div id="il"></div>'+
    '<button class="btn big" data-addi style="margin-bottom:12px">＋ 材料を追加</button>'+
    '<div class="card"><div class="cap">合計（ケトン比 <b id="dr"></b>）</div><div class="nums" id="dt" style="margin-top:4px"></div></div>'+
    (o.alsoMy?'<label class="chk"><input type="checkbox" id="am"><span>マイフードにも登録する</span></label>':'')+
    '<button class="btn primary big" data-save>'+esc(o.saveLabel||'保存する')+'</button><div id="extra" style="margin-top:10px;display:grid;gap:10px"></div></div>');
  var b=sh.box; $('[data-x]',b).onclick=sh.close;
  function tot(){var t=dishT(items,1);$('#dt',b).innerHTML=numsHtml(t);$('#dr',b).textContent=ratioTxt(t)+' : 1'}
  function paintItems(){
    $('#il',b).innerHTML=items.length?items.map(function(it,i){return '<div class="irow"><div class="nm">'+esc(it.n)+'</div><input data-gi="'+i+'" inputmode="decimal" value="'+it.g+'" aria-label="'+esc(it.n)+'のグラム"><button data-sw="'+i+'" aria-label="'+esc(it.n)+'を別の食品に入れかえる">⇄</button><button data-rm="'+i+'" aria-label="'+esc(it.n)+'を外す">✕</button></div>'}).join('')+'<p class="note" style="margin:-2px 0 10px">⇄ は別の食品への入れかえ、✕ は外すボタンです。</p>':'<p class="note">材料がまだありません。</p>';
    tot();
  }
  b.addEventListener('input',function(e){var i=e.target.dataset.gi;if(i!=null){var v=toNum(e.target.value);items[+i].g=v>=0?v:0;tot()}});
  b.addEventListener('click',function(e){
    var rm=e.target.closest('[data-rm]'); if(rm){items.splice(+rm.dataset.rm,1);paintItems();return}
    var sw=e.target.closest('[data-sw]');
    if(sw){var i=+sw.dataset.sw;openPicker({mode:'item',once:true,defaultG:items[i].g,title:items[i].n+' を入れかえる',onPick:function(kind,f,g){items[i]={n:f.n,g:g,per:f.per};paintItems()}})}
  });
  $('[data-addi]',b).onclick=function(){openPicker({mode:'item',title:'材料を選ぶ',onPick:function(kind,f,g){items.push({n:f.n,g:g,per:f.per});paintItems()}})};
  $('[data-save]',b).onclick=function(){
    var n=$('#dn',b).value.trim();
    if(!n){toast('料理の名前を入れてください');$('#dn',b).focus();return}
    if(!items.length){toast('材料を1つ以上入れてください');return}
    if(items.some(function(i){return !(i.g>0)})){toast('グラムが0の材料があります');return}
    var am=$('#am',b);
    sh.close(); o.onSave(n,copyItems(items),!!(am&&am.checked));
  };
  function armBtn(label,cls,fn,confirmTxt){
    var btn=h('<button class="btn '+cls+' big">'+label+'</button>'), armed=false; $('#extra',b).appendChild(btn);
    btn.onclick=function(){if(confirmTxt&&!armed){armed=true;btn.textContent=confirmTxt;setTimeout(function(){armed=false;btn.textContent=label},3000);return}fn()};
  }
  if(o.asNew)armBtn('この内容を新しいマイフードとして保存','ghost',function(){
    var n=$('#dn',b).value.trim(); if(!n){toast('料理の名前を入れてください');return}
    if(!items.length){toast('材料を1つ以上入れてください');return}
    S.my.push({id:uid(),name:n,items:copyItems(items)});save();render();toast('マイフードに登録しました')});
  if(o.onDelete)armBtn(esc(o.delLabel||'削除'),'danger',function(){sh.close();o.onDelete()},'もう一度押すと削除します');
  paintItems();
}
/* マイフードの登録・直し */
function openDish(dish,prefill){
  openDishEditor({title:dish?'マイフードをなおす':'新しいマイフード',name:dish?dish.name:'',items:dish?dish.items:(prefill||[]),
    onSave:function(n,items){if(dish){dish.name=n;dish.items=items}else S.my.push({id:uid(),name:n,items:items});save();render();toast('保存しました')},
    onDelete:dish?function(){S.my=S.my.filter(function(x){return x!==dish});save();render();toast('削除しました')}:null,delLabel:'このマイフードを削除'});
}
/* 食事に入れる料理を、名前からつくる（マイフードから材料を変えて入れる場合もここ） */
function openNewDish(meal,items,name){
  openDishEditor({title:mealName(meal)+'の料理をつくる',name:name||'',items:items||[],saveLabel:mealName(meal)+'に入れる',alsoMy:true,
    note:'料理の名前をつけて、材料を入れてください。',
    onSave:function(n,its,also){addDish(meal,{name:n,items:its},1);if(also){S.my.push({id:uid(),name:n,items:copyItems(its)});save()}toast(n+' を'+mealName(meal)+'に入れました')}});
}
/* 食事に入れた料理の中身を、その日の分だけ直す（マイフードの元の登録は変わらない） */
function openDishEntry(meal,e){
  var its=e.items.map(function(i){return {n:i.n,g:+(i.g*(e.mult||1)).toFixed(1),per:i.per}});
  openDishEditor({title:'この料理の中身を直す',name:e.name,items:its,saveLabel:'この内容に変更',asNew:true,
    note:'ここで直しても、マイフードの元の登録は変わりません。この食事の分だけ変わります。',
    onSave:function(n,items){e.name=n;e.items=items;e.mult=1;ensureDay(D);save();render();toast('変更しました')},
    onDelete:function(){var d=ensureDay(D);d[meal]=d[meal].filter(function(x){return x.id!==e.id});save();render()},delLabel:'この料理を記録から削除'});
}

/* ---------- 食事の記録を直す ---------- */
function openEntry(meal,id){
  var day=getDay(D), list=day[meal], e=list.filter(function(x){return x.id===id})[0]; if(!e)return;
  if(e.kind==='d'){openDishEntry(meal,e);return}
  var isF=e.kind==='f';
  var sh=openSheet('<div class="sheetTop"><h2>'+esc(e.name)+'</h2><button class="btn sm" data-x>閉じる</button></div><div class="sheetBody"><div class="pick" style="border:0;padding:0 0 10px;background:none"><div class="amount"><input id="ea" inputmode="decimal" value="'+(isF?e.g:e.mult)+'"><span>'+(isF?'g':'人前')+'</span></div><div class="prev nums" id="ep"></div></div><button class="btn primary big" data-save>変更を保存</button><button class="btn danger big" data-del style="margin-top:10px">この記録を削除</button></div>',true);
  var b=sh.box; $('[data-x]',b).onclick=sh.close;
  var a=$('#ea',b);
  function upd(){var v=toNum(a.value);$('#ep',b).innerHTML=v>0?numsHtml(isF?itemT({g:v,per:e.per},1):dishT(e.items,v)):'<span>数字を入れてください</span>'}
  a.oninput=upd; upd(); a.focus(); a.select();
  $('[data-save]',b).onclick=function(){var v=toNum(a.value);if(!(v>0)){toast('数字を入れてください');return}
    if(isF)e.g=v;else e.mult=v; ensureDay(D); S.days[D][meal]=list; save();sh.close();render()};
  var d=$('[data-del]',b), armed=false;
  d.onclick=function(){if(!armed){armed=true;d.textContent='もう一度押すと削除します';setTimeout(function(){armed=false;d.textContent='この記録を削除'},3000);return}
    S.days[D][meal]=list.filter(function(x){return x.id!==id}); save();sh.close();render()};
}

/* ---------- 食事へ追加 ---------- */
function mealName(k){return MEALS.filter(function(m){return m[0]===k})[0][1]}
function addFood(meal,f,g,date){var d=ensureDay(date||D);d[meal].push({id:uid(),kind:'f',name:f.n,g:g,per:f.per});save();render()}
function addDish(meal,dish,mult,date){var d=ensureDay(date||D);d[meal].push({id:uid(),kind:'d',name:dish.name,mult:mult,items:dish.items.map(function(i){return {n:i.n,g:i.g,per:i.per}})});save();render()}

/* ---------- バックアップ ---------- */
function backupText(){return JSON.stringify(S)}
function doImport(text){
  var o; try{o=JSON.parse(text)}catch(e){toast('読み込めませんでした。控えの文章をすべて貼り付けてください');return}
  if(!o||typeof o!=='object'||!o.days){toast('このアプリの控えではないようです');return}
  S=Object.assign(blank(),o);save();render();toast('読み込みました');
}

/* ---------- イベント ---------- */
$('#app').addEventListener('click',function(e){
  var b=e.target.closest('[data-act]'); if(!b)return;
  var act=b.dataset.act, m=b.dataset.meal, id=b.dataset.id;
  if(act==='add')openPicker({mode:'meal',title:mealName(m)+'に追加',onPick:function(kind,obj,v){if(kind==='dish')addDish(m,obj,v);else addFood(m,obj,v)},
    onTweak:function(dish,v){openNewDish(m,dish.items.map(function(i){return {n:i.n,g:+(i.g*v).toFixed(1),per:i.per}}),dish.name)}});
  else if(act==='newDishMeal')openNewDish(m,[],'');
  else if(act==='edit')openEntry(m,id);
  else if(act==='toggle'){open[id]=!open[id];render()}
  else if(act==='saveMy'){
    var pre=[];getDay(D)[m].forEach(function(en){if(en.kind==='f')pre.push({n:en.name,g:en.g,per:en.per});else en.items.forEach(function(i){pre.push({n:i.n,g:+(i.g*(en.mult||1)).toFixed(1),per:i.per})})});
    openDish(null,pre);
  }
  else if(act==='newDish')openDish(null,null);
  else if(act==='editDish'){var d=S.my.filter(function(x){return x.id===id})[0];if(d)openDish(d)}
  else if(act==='dishTo'){var dd=S.my.filter(function(x){return x.id===id})[0];if(dd){addDish(m,dd,1,D);toast(dd.name+' を'+mealName(m)+'に入れました（'+dateText(D)+'）')}}
  else if(act==='delCustom'){
    if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='もう一度押す';setTimeout(function(){b.dataset.armed='0';b.textContent='削除'},3000);return}
    S.custom=S.custom.filter(function(c){return c.id!==id});save();render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
  }
  else if(act==='export'){$('#bk').value=backupText();$('#bk').focus();$('#bk').select();toast('控えを作りました')}
  else if(act==='copy'){var t=backupText();$('#bk').value=t;try{navigator.clipboard.writeText(t).then(function(){toast('コピーしました')},function(){$('#bk').select();toast('コピーできませんでした。選択した文章を長押しでコピーしてください')})}catch(x){$('#bk').select();toast('文章を選択しました。長押しでコピーしてください')}}
  else if(act==='dl'){try{var bl=new Blob([backupText()],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='ketoshoku-note-'+iso(new Date())+'.json';document.body.appendChild(a);a.click();a.remove();toast('保存しました（ダウンロードを確認してください）')}catch(x){toast('この画面では保存できません。「コピー」を使ってください')}}
  else if(act==='import'){var v=$('#bk').value.trim();if(!v){toast('控えの文章を貼り付けてください');return}
    if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='今の記録を上書きします。もう一度押す';setTimeout(function(){b.dataset.armed='0';b.textContent='読み込む'},4000);return}
    doImport(v)}
});
$('#app').addEventListener('change',function(e){
  var t=e.target;
  if(t.id&&t.id.indexOf('g_')===0){var k=t.id.slice(2),v=toNum(t.value);if(v>0)S.goals[k]=v;else{delete S.goals[k];t.value=''}save()}
  if(t.id==='bkfile'&&t.files[0]){var fr=new FileReader();fr.onload=function(){$('#bk').value=fr.result;doImport(fr.result)};fr.readAsText(t.files[0])}
});
$$('.nav button').forEach(function(b){b.onclick=function(){tab=b.dataset.tab;render();window.scrollTo(0,0)}});
$('#prevDay').onclick=function(){shift(-1)}; $('#nextDay').onclick=function(){shift(1)};
$('#todayBtn').onclick=function(){D=iso(new Date());render()};
$('#dateInput').onchange=function(e){if(e.target.value){D=e.target.value;render()}};

render();
})();
</script>
</body>
</html>
